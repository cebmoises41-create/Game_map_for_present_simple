<script>
// =====================================================================
//  DATABASE (Routines) - 40+ sentences mixed
// =====================================================================
const QUESTION_BANK = [
  // Level 1: Basic Multiple Choice (Island 1)
  { type: "choice", spanish: "Ella se levanta a las 6:00 am.", correct: "She wakes up at 6:00 am.", wrong: ["She wake up at 6:00 am.", "He wakes up at 6:00 am.", "She goes to bed at 6:00 am."] },
  { type: "choice", spanish: "Él se cepilla los dientes.", correct: "He brushes his teeth.", wrong: ["He brush his teeth.", "She brushes her teeth.", "He washes his face."] },
  { type: "choice", spanish: "Nosotros desayunamos a las 7:00 am.", correct: "We have breakfast at 7:00 am.", wrong: ["We has breakfast at 7:00 am.", "They have breakfast at 7:00 am.", "We have lunch at 7:00 am."] },
  { type: "choice", spanish: "Ella va a la escuela.", correct: "She goes to school.", wrong: ["She go to school.", "He goes to school.", "She go to the school."] },
  { type: "choice", spanish: "Ellos almuerzan a las 12:00 pm.", correct: "They have lunch at 12:00 pm.", wrong: ["They has lunch at 12:00 pm.", "He has lunch at 12:00 pm.", "They have dinner at 12:00 pm."] },
  { type: "choice", spanish: "Yo me acuesto a las 10:00 pm.", correct: "I go to bed at 10:00 pm.", wrong: ["I goes to bed at 10:00 pm.", "I wake up at 10:00 pm.", "I am go to bed at 10:00 pm."] },
  { type: "choice", spanish: "Él ve la televisión.", correct: "He watches TV.", wrong: ["He watch TV.", "She watches TV.", "He watchs TV."] },
  { type: "choice", spanish: "Mi mamá cocina la cena.", correct: "My mom cooks dinner.", wrong: ["My mom cook dinner.", "My dad cooks dinner.", "My mom cook the dinner."] },
  { type: "choice", spanish: "Ellos juegan futbol después de la escuela.", correct: "They play soccer after school.", wrong: ["They plays soccer after school.", "They play soccer after the school.", "They played soccer after school."] },
  { type: "choice", spanish: "Ella se lava la cara.", correct: "She washes her face.", wrong: ["She wash her face.", "He washes his face.", "She washes his face."] },

  // Level 2: Intermediate Multiple Choice (Island 2)
  { type: "choice", spanish: "Nosotros leemos un libro.", correct: "We read a book.", wrong: ["We reads a book.", "We reading a book.", "They read a book."] },
  { type: "choice", spanish: "Tú haces la tarea.", correct: "You do your homework.", wrong: ["You does your homework.", "You do you homework.", "You are do your homework."] },
  { type: "choice", spanish: "El perro duerme en el sofá.", correct: "The dog sleeps on the sofa.", wrong: ["The dog sleep on the sofa.", "The dog sleeps in the sofa.", "The dog is sleep on the sofa."] },
  { type: "choice", spanish: "Ella se viste rápidamente.", correct: "She gets dressed quickly.", wrong: ["She get dressed quickly.", "She gets dress quickly.", "He gets dressed quickly."] },
  { type: "choice", spanish: "Él siempre llega tarde.", correct: "He always arrives late.", wrong: ["He always arrive late.", "He arrive always late.", "He is always arrive late."] },
  { type: "choice", spanish: "Nosotros nunca desayunamos.", correct: "We never have breakfast.", wrong: ["We never has breakfast.", "We don't never have breakfast.", "We not have breakfast."] },
  { type: "choice", spanish: "A ella le gusta escuchar música.", correct: "She likes listening to music.", wrong: ["She like listening to music.", "She likes listen to music.", "She like to listen music."] },
  { type: "choice", spanish: "Él no va al gimnasio.", correct: "He does not go to the gym.", wrong: ["He do not go to the gym.", "He not go to the gym.", "He doesn't goes to the gym."] },
  { type: "choice", spanish: "¿Tú cepillas tus dientes?", correct: "Do you brush your teeth?", wrong: ["Does you brush your teeth?", "Do you brushes your teeth?", "Are you brush your teeth?"] },

  // Level 3: Harder Multiple Choice (Island 3)
  { type: "choice", spanish: "Mi papá trabaja en una oficina.", correct: "My dad works in an office.", wrong: ["My dad work in an office.", "My dad works in a office.", "My dad is work in an office."] },
  { type: "choice", spanish: "Ellos visitan a su abuela los domingos.", correct: "They visit their grandmother on Sundays.", wrong: ["They visits their grandmother on Sundays.", "They visit his grandmother on Sundays.", "They visit their grandmother in Sundays."] },
  { type: "choice", spanish: "Ella hace ejercicio por la mañana.", correct: "She exercises in the morning.", wrong: ["She exercises on the morning.", "She exercise in the morning.", "He exercises in the morning."] },
  
  // Level 4: Writing (Island 4)
  { type: "write", spanish: "Ella se despierta a las 7:00 am.", correct: "She wakes up at 7:00 am." },
  { type: "write", spanish: "Él se baña todos los días.", correct: "He takes a shower every day." },
  { type: "write", spanish: "Nosotros vamos al parque.", correct: "We go to the park." },
  { type: "write", spanish: "Ellos estudian inglés.", correct: "They study English." },
  { type: "write", spanish: "Yo como frutas.", correct: "I eat fruit." },
  { type: "write", spanish: "Ella lee un libro.", correct: "She reads a book." },
  { type: "write", spanish: "Él escribe una carta.", correct: "He writes a letter." },
  { type: "write", spanish: "Nosotros escuchamos música.", correct: "We listen to music." },
  { type: "write", spanish: "Tú lavas los platos.", correct: "You wash the dishes." },
  { type: "write", spanish: "Mi mamá prepara el desayuno.", correct: "My mom makes breakfast." },

  // Level 5: Advanced Writing (Island 5)
  { type: "write", spanish: "Él nunca se levanta tarde.", correct: "He never gets up late." },
  { type: "write", spanish: "Nosotros siempre vamos al cine los viernes.", correct: "We always go to the cinema on Fridays." },
  { type: "write", spanish: "Ella a veces cocina pasta.", correct: "She sometimes cooks pasta." },
  { type: "write", spanish: "Yo no bebo café por la noche.", correct: "I do not drink coffee at night." },
  { type: "write", spanish: "Ellos no trabajan los domingos.", correct: "They do not work on Sundays." },
  { type: "write", spanish: "¿Él juega tenis?", correct: "Does he play tennis?" },
  { type: "write", spanish: "¿Tú lees el periódico?", correct: "Do you read the newspaper?" },
  { type: "write", spanish: "Mi hermano hace su cama.", correct: "My brother makes his bed." },
  { type: "write", spanish: "Ellos limpian su habitación.", correct: "They clean their room." },
  { type: "write", spanish: "Ella visita a sus amigos.", correct: "She visits her friends." }
];

// =====================================================================
//  GAME CONFIGURATION (Islands: 5, 5, 6, 8, 10 questions)
// =====================================================================
const ISLANDS_CONFIG = [
  { id: 0, questions: 5, time: 80 },
  { id: 1, questions: 5, time: 80 },
  { id: 2, questions: 6, time: 80 },
  { id: 3, questions: 8, time: 80 },
  { id: 4, questions: 10, time: 80 }
];

let currentIsland = 0;
let currentQuestionIndex = 0;
let currentIslandQuestions = [];
let timerInterval = null;
let timeLeft = 80;
let scoreIslands = 0;

const pirate = document.getElementById('pirate');
const timerDisplay = document.getElementById('timerDisplay');
const scoreDisplay = document.getElementById('scoreDisplay');
const questionText = document.getElementById('questionText');
const dynamicArea = document.getElementById('dynamicArea');
const currentIslandNumDisplay = document.getElementById('currentIslandNum');
const currentQuestionNumDisplay = document.getElementById('currentQuestionNum');

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  document.getElementById('introScreen').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  currentIsland = 0;
  scoreIslands = 0;
  updatePiratePosition();
  loadIsland(0);
}

function loadIsland(islandIdx) {
  currentIsland = islandIdx;
  currentQuestionIndex = 0;
  const config = ISLANDS_CONFIG[islandIdx];
  
  currentIslandNumDisplay.textContent = islandIdx + 1;
  currentQuestionNumDisplay.textContent = "1/" + config.questions;
  
  const allQuestions = shuffleArray(QUESTION_BANK);
  const choiceQs = allQuestions.filter(q => q.type === 'choice');
  const writeQs = allQuestions.filter(q => q.type === 'write');
  
  if (islandIdx === 0) {
    currentIslandQuestions = choiceQs.slice(0, config.questions);
  } else if (islandIdx === 1) {
    currentIslandQuestions = choiceQs.slice(config.questions, config.questions + config.questions);
  } else if (islandIdx === 2) {
    currentIslandQuestions = [...choiceQs.slice(10, 13), ...writeQs.slice(0, 3)];
  } else {
    currentIslandQuestions = writeQs.slice(0, config.questions);
  }
  
  currentIslandQuestions = shuffleArray(currentIslandQuestions);
  loadQuestion();
}

function loadQuestion() {
  if (currentQuestionIndex >= currentIslandQuestions.length) {
    completeIsland();
    return;
  }

  resetTimer(ISLANDS_CONFIG[currentIsland].time);
  
  const q = currentIslandQuestions[currentQuestionIndex];
  currentQuestionNumDisplay.textContent = (currentQuestionIndex + 1) + "/" + currentIslandQuestions.length;
  questionText.textContent = `"${q.spanish}"`;
  
  dynamicArea.innerHTML = '';

  if (q.type === 'choice') {
    const grid = document.createElement('div');
    grid.className = 'options-grid';
    const options = shuffleArray([q.correct, ...q.wrong]);
    
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'btn-option';
      btn.textContent = opt;
      btn.onclick = () => checkAnswer(btn, opt, q.correct);
      grid.appendChild(btn);
    });
    dynamicArea.appendChild(grid);
  } else {
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'write-input';
    input.placeholder = 'Type the English translation...';
    input.autocomplete = 'off';
    
    const btn = document.createElement('button');
    btn.className = 'btn-submit';
    btn.textContent = 'Check';
    
    const feedback = document.createElement('div');
    feedback.style.marginTop = '10px';
    feedback.style.fontWeight = 'bold';

    function checkWrite() {
      const val = input.value.trim().toLowerCase().replace(/[.,!?]/g, '');
      const correct = q.correct.toLowerCase().replace(/[.,!?]/g, '');
      if (!val) return;
      
      input.disabled = true;
      btn.disabled = true;
      clearInterval(timerInterval);

      if (val === correct) {
        input.style.borderColor = 'var(--success)';
        feedback.style.color = 'var(--success)';
        feedback.textContent = '✅ Correct!';
        setTimeout(nextQuestion, 1500);
      } else {
        input.style.borderColor = 'var(--error)';
        feedback.style.color = 'var(--error)';
        feedback.textContent = `❌ Correct: ${q.correct}`;
        timeLeft = Math.max(0, timeLeft - 5);
        setTimeout(nextQuestion, 2500);
      }
    }

    btn.onclick = checkWrite;
    input.addEventListener('keydown', e => { if(e.key === 'Enter') checkWrite(); });
    dynamicArea.appendChild(input);
    dynamicArea.appendChild(btn);
    dynamicArea.appendChild(feedback);
    setTimeout(() => input.focus(), 100);
  }
}

function checkAnswer(btn, selected, correct) {
  const allBtns = document.querySelectorAll('.btn-option');
  allBtns.forEach(b => b.disabled = true);
  clearInterval(timerInterval);

  if (selected === correct) {
    btn.classList.add('correct');
    setTimeout(nextQuestion, 1000);
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b => { if (b.textContent === correct) b.classList.add('correct'); });
    timeLeft = Math.max(0, timeLeft - 5);
    setTimeout(nextQuestion, 2000);
  }
}

function nextQuestion() {
  currentQuestionIndex++;
  loadQuestion();
}

function resetTimer(seconds) {
  clearInterval(timerInterval);
  timeLeft = seconds;
  updateTimerDisplay();
  
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      alert("⏰ Time's up! You must try this island again.");
      loadIsland(currentIsland);
    }
  }, 1000);
}

function updateTimerDisplay() {
  timerDisplay.textContent = `⏱️ ${timeLeft}s`;
  if (timeLeft <= 15) {
    timerDisplay.style.background = 'var(--error)';
    timerDisplay.style.animation = 'pulse 0.5s infinite alternate';
  } else {
    timerDisplay.style.background = 'rgba(231, 76, 60, 0.8)';
    timerDisplay.style.animation = 'none';
  }
}

function completeIsland() {
  clearInterval(timerInterval);
  scoreIslands++;
  scoreDisplay.textContent = scoreIslands;
  
  const islandEl = document.getElementById(`island${currentIsland}`);
  if (islandEl) islandEl.classList.add('completed');
  
  currentIsland++;
  if (currentIsland < ISLANDS_CONFIG.length) {
    updatePiratePosition();
    setTimeout(() => {
      loadIsland(currentIsland);
    }, 1000);
  } else {
    endGame();
  }
}

function updatePiratePosition() {
  const totalIslands = ISLANDS_CONFIG.length;
  const progress = currentIsland / totalIslands;
  const minLeft = 8;
  const maxLeft = 92;
  const leftPos = minLeft + (progress * (maxLeft - minLeft));
  pirate.style.left = `${leftPos}%`;
}

function endGame() {
  clearInterval(timerInterval);
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('finalScreen').classList.add('active');
  document.getElementById('finalScore').textContent = scoreIslands;
  pirate.style.left = "92%";
  document.getElementById('treasureIsland').classList.add('completed');
}
</script>

</body>
</html>
